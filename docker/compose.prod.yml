# Rotación de registros, compartida por todos los servicios.
#
# Docker NO rota los registros de contenedor por defecto: crecen hasta llenar
# el disco. En este mismo servidor un contenedor en bucle de reinicio acumuló
# 1,2 GB en un archivo, y entre dos de ellos se comieron 2 GB.
#
# Con esto cada servicio guarda como mucho 30 MB de histórico. Se aplica al
# crear el contenedor, así que un servicio ya levantado necesita recrearse
# —`up -d`— para tomarlo.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # `db` se define en compose.yml; aquí solo se le añade la rotación. Postgres
  # escribe cada conexión y cada error, y es de los que más registro genera.
  db:
    logging: *logging

  # Migraciones como servicio de un solo uso.
  #
  # Corre hasta terminar y sale; la aplicación no arranca hasta que haya salido
  # bien. Así nunca hay una versión del código hablando con un esquema que
  # todavía no existe, que es el fallo clásico de aplicar migraciones "en algún
  # momento" del despliegue.
  #
  # Usa la etapa `builder` porque tiene el node_modules completo. La imagen de
  # runtime es deliberadamente mínima y no puede migrar.
  migrate:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: builder
    command: ["pnpm", "db:migrate"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-gmao}:${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-gmao}
      # Migrar solo necesita la base, pero esta es además la imagen de
      # operación: los scripts de arranque en frío se ejecutan con
      # `docker compose run --rm migrate ...` porque el runtime standalone no
      # lleva ni tsx ni los scripts. Sin estas variables, better-auth avisa de
      # que no tiene URL base y un secreto distinto al de la aplicación pasaría
      # inadvertido.
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?falta BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?falta BETTER_AUTH_URL}
      UPLOAD_DIR: /app/data/adjuntos
    # La misma carpeta que `web`: la carga de demostración deja aquí sus fotos.
    volumes:
      - /opt/pms-data/adjuntos:/app/data/adjuntos
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    logging: *logging

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: runner
    restart: unless-stopped
    logging: *logging
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-gmao}:${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-gmao}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      # Sin valor por defecto a propósito: un secreto de desarrollo en
      # producción invalida todas las sesiones que firma.
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?falta BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?falta BETTER_AUTH_URL}
      UPLOAD_DIR: /app/data/adjuntos
    # Adjuntos en una carpeta del host, fuera del contenedor: si vivieran
    # dentro, cada despliegue los borraría. La carpeta debe pertenecer al
    # usuario 1001 (`nextjs`), que es con el que corre la aplicación.
    volumes:
      - /opt/pms-data/adjuntos:/app/data/adjuntos
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

    # Sin puertos publicados a propósito. Quién termina TLS y expone la
    # aplicación se elige con un archivo adicional, según lo que haya en el
    # servidor:
    #
    #   compose.caddy.yml       servidor limpio: Caddy pide el certificado solo
    #   compose.host-proxy.yml  ya hay un proxy (nginx, Traefik…) en 80/443
    #
    # Sin uno de los dos, la aplicación solo se alcanza desde dentro del host.
