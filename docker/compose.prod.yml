services:
  # Migraciones como servicio de un solo uso.
  #
  # Corre hasta terminar y sale; la aplicación no arranca hasta que haya salido
  # bien. Así nunca hay una versión del código hablando con un esquema que
  # todavía no existe, que es el fallo clásico de aplicar migraciones "en algún
  # momento" del despliegue.
  #
  # Usa la etapa `builder` porque tiene el node_modules completo. La imagen de
  # runtime es deliberadamente mínima y no puede migrar.
  migrate:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: builder
    command: ["pnpm", "db:migrate"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-gmao}:${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-gmao}
      # Migrar solo necesita la base, pero esta es además la imagen de
      # operación: los scripts de arranque en frío se ejecutan con
      # `docker compose run --rm migrate ...` porque el runtime standalone no
      # lleva ni tsx ni los scripts. Sin estas variables, better-auth avisa de
      # que no tiene URL base y un secreto distinto al de la aplicación pasaría
      # inadvertido.
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?falta BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?falta BETTER_AUTH_URL}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: runner
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-gmao}:${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-gmao}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      # Sin valor por defecto a propósito: un secreto de desarrollo en
      # producción invalida todas las sesiones que firma.
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?falta BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?falta BETTER_AUTH_URL}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
