services:
  db:
    ports:
      - "5432:5432"

  adminer:
    image: adminer:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: dev
    restart: unless-stopped
    ports:
      # El 3000 suele estar tomado por otros proyectos; se puede reasignar
      # con WEB_PORT en .env sin tocar este archivo.
      - "${WEB_PORT:-3100}:3000"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-gmao}:${POSTGRES_PASSWORD:-gmao}@db:5432/${POSTGRES_DB:-gmao}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}
    volumes:
      # Bind mount del código para HMR...
      - ..:/app
      # ...pero node_modules y .next viven en volúmenes nombrados: los binarios
      # nativos compilados en Linux no deben mezclarse con el host Windows.
      - node_modules:/app/node_modules
      - next_cache:/app/.next
      - pnpm_store:/pnpm/store
    depends_on:
      db:
        condition: service_healthy

volumes:
  node_modules:
  next_cache:
  pnpm_store:
