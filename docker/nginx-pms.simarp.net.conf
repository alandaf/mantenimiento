# Bloque de nginx para PMS SIMARP, en un servidor que ya sirve otros sitios.
#
# En el VPS:
#   sudo cp nginx-pms.simarp.net.conf /etc/nginx/sites-available/pms.simarp.net
#   sudo ln -s /etc/nginx/sites-available/pms.simarp.net /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d pms.simarp.net
#
# certbot reescribe este archivo añadiendo el certificado y la redirección a
# HTTPS. Por eso aquí solo va el puerto 80: lo demás lo pone él.

server {
    listen 80;
    listen [::]:80;
    server_name pms.simarp.net;

    # Los informes en PDF y las importaciones de Excel superan el límite por
    # defecto de nginx (1 MB), que rechazaría la subida con un 413.
    client_max_body_size 25M;

    location / {
        proxy_pass http://127.0.0.1:3210;
        proxy_http_version 1.1;

        # Next.js construye enlaces y redirecciones a partir de estas
        # cabeceras. Sin ellas, al iniciar sesión redirigiría a http://127.0.0.1
        # en lugar de al dominio.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Generar un PDF mensual con un año de histórico puede pasar de los 60
        # segundos por defecto, y el análisis de causa raíz llama al modelo.
        proxy_read_timeout 120s;
        proxy_buffering off;
    }
}
