name: CI

on:
  # Todas las ramas: un fallo se detecta antes de abrir el PR, no después.
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --no-frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Tests de KPI
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          # El build no consulta la BD, pero src/db valida la variable al importar.
          DATABASE_URL: postgres://gmao:gmao@localhost:5432/gmao
